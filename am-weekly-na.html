<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Weekly — Nouvelle-Aquitaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{
  color-scheme: light;
  --primary:#00809D; --dark:#024251; --blue:#54CEEA; --green:#74CFA9;
  --coral:#FD937B; --bg:#FAF9F8; --text:#2B2926; --grey:#938F8B;
  --card:#ffffff; --line:#eae7e3;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,Arial,sans-serif;font-weight:300;color:var(--text);background:var(--bg);line-height:1.45;font-size:14px}
h1,h2,h3,.b{font-weight:600}
.wrap{display:flex;min-height:100vh}
/* Sidebar */
.side{width:220px;flex:0 0 220px;background:var(--dark);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{font-weight:600;font-size:15px;letter-spacing:.3px;margin-bottom:2px}
.side .sub{font-size:11px;color:#9fc6cf;margin-bottom:16px}
.qbar{display:flex;gap:6px;margin-bottom:14px}
.qbar button{flex:1;background:transparent;border:1px solid #2f6472;color:#cfe8ee;border-radius:20px;padding:5px 0;font-family:inherit;font-size:12px;cursor:pointer}
.qbar button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.mlabel{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#7fb0bc;margin:6px 4px 8px}
.mlist{list-style:none}
.mlist li{margin-bottom:6px}
.mlist button{width:100%;text-align:left;background:transparent;border:none;color:#dCEBEF;padding:9px 11px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.mlist button:hover{background:#0c3743}
.mlist button.on{background:var(--primary);color:#fff;font-weight:600}
.mlist .dot{font-size:9px;color:var(--green)}
.mlist button.on .dot{color:#fff}
/* Main */
.main{flex:1;padding:26px 30px 60px;max-width:1150px}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--primary);padding-bottom:12px;margin-bottom:22px;flex-wrap:wrap;gap:8px}
.top h1{font-size:22px;color:var(--dark)}
.top .meta{font-size:12px;color:var(--grey);text-align:right}
.top .meta .d{font-weight:600;color:var(--primary);font-size:14px}
section.card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(2,66,81,.06),0 6px 20px rgba(2,66,81,.04);padding:20px 22px;margin-bottom:20px;border-top:3px solid var(--primary)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sh .n{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 26px}
.sh h2{font-size:16px;color:var(--dark)}
.src{font-size:11px;color:var(--grey);margin:2px 0 16px 36px}
.src a{color:var(--primary);text-decoration:none}
/* STAR */
.star{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.star .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--green);flex:0 0 96px}
.star .info .big{font-size:22px;font-weight:600;color:var(--dark)}
.star .info .role{font-size:12px;color:var(--grey);margin-bottom:6px}
.badge{display:inline-block;background:var(--green);color:#03352a;font-weight:600;border-radius:20px;padding:4px 12px;font-size:12px}
.rank{flex:1;min-width:260px}
.rk{display:grid;grid-template-columns:90px 1fr 42px;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.rk .bar{height:16px;background:var(--blue);border-radius:8px}
.rk.win .bar{background:var(--primary)}
.rk .v{text-align:right;font-weight:600}
/* tables */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--dark);background:#f3f7f8;position:sticky;top:0}
td.name,th.name{text-align:left;font-weight:600;color:var(--dark)}
tbody tr:hover{background:#f7fbfc}
tr.focus td{background:#eef9f4}
tr.focus td.name{color:var(--primary)}
tr.avg td{background:#fff7f2;font-style:italic;color:var(--grey)}
.tag{font-size:9px;background:var(--primary);color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;font-weight:600}
.scroll{overflow:auto;max-height:none}
.note{font-size:11px;color:var(--grey);margin-top:10px}
/* follow up */
.fu textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;background:#fcfcfb}
.fu .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fu input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px}
.fu input.who{width:150px}.fu input.txt{flex:1;min-width:200px}
.btn{background:var(--primary);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.items{list-style:none;margin-top:14px}
.items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fcfcfb}
.items .who{font-weight:600;color:var(--primary);flex:0 0 130px}
.items .txt{flex:1}
.items .del{background:none;border:none;color:var(--coral);cursor:pointer;font-size:15px;line-height:1}
.empty{font-size:12px;color:var(--grey);font-style:italic}
/* success grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:4px}
.scard{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fcfcfb}
.scard .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.scard .av{width:26px;height:26px;border-radius:50%;background:var(--green);color:#03352a;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 26px}
.scard .nm{font-weight:600;color:var(--dark);font-size:13px}
.scard .avimg{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px}
.scard textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:12.5px;resize:vertical;background:#fff}
.saved{font-size:11px;color:var(--green);margin-left:8px}
.legend{font-size:11px;color:var(--grey);margin-top:8px}
.legend span{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin:0 3px 0 10px}
footer{color:var(--grey);font-size:11px;text-align:center;padding:20px}
.template{background:#f3f7f8;border:1px dashed #cdd9db;border-radius:10px;padding:22px;text-align:center;color:var(--grey);font-size:13px}
@media(max-width:820px){.wrap{flex-direction:column}.side{width:100%;height:auto;position:static;flex:none}.mlist{display:flex;flex-wrap:wrap;gap:6px}.mlist li{margin:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="side">
    <div class="brand">AM Weekly</div>
    <div class="sub">Nouvelle-Aquitaine · Réunion bi-mensuelle</div>
    <div class="qbar" id="qbar"></div>
    <div class="mlabel">Réunions</div>
    <ul class="mlist" id="mlist"></ul>
    <div style="font-size:10.5px;color:#7fb0bc;margin:12px 4px;line-height:1.5">Chaque réunion se fige dans sa propre page. Les semaines passées ne bougent plus ; utilise 💾 <b>Enregistrer</b> pour archiver la semaine.</div>
  </nav>
  <main class="main">
    <div class="top">
      <h1>AM Weekly — Nouvelle-Aquitaine</h1>
      <div class="meta"><div class="d" id="topdate"></div><div id="topq"></div></div>
    </div>
    <div style="display:flex;gap:8px;margin:-6px 0 18px;flex-wrap:wrap">
      <button onclick="downloadDeck()" style="background:var(--primary);color:#fff;border:none;border-radius:20px;padding:7px 16px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer">💾 Enregistrer cette semaine</button>
      <button onclick="window.print()" style="background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:20px;padding:7px 16px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer">🖨️ Imprimer / PDF</button>
    </div>
    <div id="content"></div>
    <footer>© Holidu GmbH | Confidential</footer>
  </main>
</div>

 </div>`;

function keyFT(){return "amweekly_ft_"+curM;}
function keyIT(){return "amweekly_it_"+curM;}
function bindFollow(){
 const ta=$("#freetext"); if(!ta)return;
 ta.value=localStorage.getItem(keyFT())||"";
 let t;
 ta.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{localStorage.setItem(keyFT(),ta.value);flash();},400);};
 $("#addbtn").onclick=addItem;
 $("#txt").addEventListener("keydown",e=>{if(e.key==="Enter")addItem();});
 renderItems();
}
function flash(){const s=$("#savedmsg");if(!s)return;s.textContent="✓ enregistré";setTimeout(()=>s.textContent="",1200);}
function getItems(){try{return JSON.parse(localStorage.getItem(keyIT())||"[]");}catch(e){return[];}}
function setItems(a){localStorage.setItem(keyIT(),JSON.stringify(a));}
function addItem(){
 const who=$("#who").value.trim(), txt=$("#txt").value.trim();
 if(!txt)return;
 const a=getItems(); a.push({who:who||"—",txt}); setItems(a);
 $("#who").value="";$("#txt").value=""; renderItems(); flash();
}
function renderItems(){
 const ul=$("#items"); if(!ul)return;
 const a=getItems();
 if(!a.length){ul.innerHTML='<div class="empty">Aucun point pour l\'instant.</div>';return;}
 ul.innerHTML=a.map((it,i)=>`<li><span class="who">${esc(it.who)}</span><span class="txt">${esc(it.txt)}</span><button class="del" data-i="${i}" title="Supprimer">✕</button></li>`).join("");
 ul.querySelectorAll(".del").forEach(b=>b.onclick=()=>{const a=getItems();a.splice(+b.dataset.i,1);setItems(a);renderItems();});
}

function isoWeek(dstr){
 const p=dstr.split('/'); const d=new Date(Date.UTC(+p[2],+p[1]-1,+p[0]));
 const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3);
 const firstThu=new Date(Date.UTC(d.getUTCFullYear(),0,4));
 const w=1+Math.round(((d-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
 return {y:d.getUTCFullYear(),w:w};
}
function downloadDeck(){
 document.querySelectorAll('textarea').forEach(function(t){t.textContent=t.value;});
 const iw=isoWeek(curM);
 const name='am-weekly-na_'+iw.y+'-W'+(iw.w<10?'0'+iw.w:iw.w)+'.html';
 let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
 html=html.replace('var FROZEN=false;','var FROZEN=true;');
 const blob=new Blob([html],{type:'text/html;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
 document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href);},0);
}
if(!FROZEN){renderNav();render();}
